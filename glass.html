<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ガラスキューブ爆発（じみた工房）</title>
<style>
  html, body {
    margin: 0;
    padding: 0;
    width: 100%;
    height: 100%;
    overflow: hidden;
    background: #eef1f5;
    font-family: "Hiragino Kaku Gothic ProN", "Meiryo", sans-serif;
  }
  canvas {
    display: block;
    cursor: grab;
  }
  canvas:active {
    cursor: grabbing;
  }
  .ui {
    position: fixed;
    bottom: 20px;
    left: 50%;
    transform: translateX(-50%);
    background: rgba(255, 255, 255, 0.88);
    backdrop-filter: blur(8px);
    padding: 10px 18px;
    border-radius: 999px;
    box-shadow: 0 4px 20px rgba(0, 0, 0, 0.12);
    display: flex;
    align-items: center;
    gap: 10px;
    font-size: 13px;
    color: #333;
    user-select: none;
    white-space: nowrap;
  }
  .ui button {
    background: #222;
    color: #fff;
    border: none;
    padding: 7px 14px;
    border-radius: 999px;
    font-size: 12px;
    font-weight: bold;
    cursor: pointer;
    transition: transform 0.1s, background 0.2s;
  }
  .ui button:hover {
    background: #444;
  }
  .ui button:active {
    transform: scale(0.93);
  }
  .ui button.boom {
    background: #ff4769;
  }
  .ui button.boom:hover {
    background: #ff2a52;
  }
</style>
</head>
<body>

<div class="ui">
  <span>ブロックをクリックで爆発！</span>
  <button id="boomBtn" class="boom">💥 パーン！</button>
  <button id="regenBtn">区切り直す</button>
  <button id="bgBtn">背景切替</button>
</div>

<script type="importmap">
  {
    "imports": {
      "three": "https://unpkg.com/three@0.169.0/build/three.module.js",
      "three/addons/": "https://unpkg.com/three@0.169.0/examples/jsm/"
    }
  }
</script>

<script type="module">
  import * as THREE from 'three';
  import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

  const scene = new THREE.Scene();
  scene.background = new THREE.Color(0xeef1f5);

  const camera = new THREE.PerspectiveCamera(
    45,
    window.innerWidth / window.innerHeight,
    0.1,
    100
  );
  camera.position.set(5.6, 4.5, 6.2);

  const renderer = new THREE.WebGLRenderer({ antialias: true });
  renderer.setSize(window.innerWidth, window.innerHeight);
  renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
  renderer.toneMapping = THREE.ACESFilmicToneMapping;
  renderer.toneMappingExposure = 1.15;
  document.body.appendChild(renderer.domElement);

  const controls = new OrbitControls(camera, renderer.domElement);
  controls.enableDamping = true;
  controls.dampingFactor = 0.06;
  controls.autoRotate = true;
  controls.autoRotateSpeed = 0.7;

  const ambientLight = new THREE.AmbientLight(0xffffff, 1.4);
  scene.add(ambientLight);

  const dirLight1 = new THREE.DirectionalLight(0xffffff, 2.2);
  dirLight1.position.set(6, 10, 7);
  scene.add(dirLight1);

  const dirLight2 = new THREE.DirectionalLight(0xaaddff, 1.2);
  dirLight2.position.set(-7, -5, -6);
  scene.add(dirLight2);

  const rootGroup = new THREE.Group();
  scene.add(rootGroup);

  const unitBox = new THREE.BoxGeometry(1, 1, 1);
  const edgeGeo = new THREE.EdgesGeometry(unitBox);

  // 爆発の進行度と状態管理
  let exploded = false;
  let explodeTimer = 0;
  let shakeIntensity = 0;
  const baseCamTarget = new THREE.Vector3(0, 0, 0);

  function colorFromPosition(x, y, z, size) {
    const nx = (x + 1.5) / 3;
    const ny = (y + 1.5) / 3;
    let hue = (0.35 + nx * 0.65 - ny * 0.25 + 1) % 1.0;
    const sat = 0.78 + Math.random() * 0.2;
    const light = size > 0.7 ? 0.58 : 0.48 + Math.random() * 0.15;
    return new THREE.Color().setHSL(hue, sat, light);
  }

  function subdivide(x, y, z, size, depth, maxDepth) {
    const splitChance = depth === 0 ? 1.0 : depth === 1 ? 0.82 : 0.55;
    if (depth < maxDepth && Math.random() < splitChance) {
      const half = size / 2;
      const offset = size / 4;
      for (let dx of [-1, 1]) {
        for (let dy of [-1, 1]) {
          for (let dz of [-1, 1]) {
            subdivide(
              x + dx * offset,
              y + dy * offset,
              z + dz * offset,
              half,
              depth + 1,
              maxDepth
            );
          }
        }
      }
      return;
    }

    const gap = size * 0.94;
    const color = colorFromPosition(x, y, z, size);
    const isClear = Math.random() < 0.18;

    const mat = new THREE.MeshPhysicalMaterial({
      color: isClear ? 0xffffff : color,
      transparent: true,
      opacity: isClear ? 0.22 : 0.55,
      roughness: 0.12,
      metalness: 0.05,
      reflectivity: 0.9,
      clearcoat: 1.0,
      clearcoatRoughness: 0.1,
      depthWrite: false,
      side: THREE.DoubleSide
    });

    const mesh = new THREE.Mesh(unitBox, mat);
    mesh.position.set(x, y, z);
    mesh.scale.set(gap, gap, gap);

    const edgeMat = new THREE.LineBasicMaterial({
      color: isClear ? 0xffffff : color.clone().offsetHSL(0, 0, 0.2),
      transparent: true,
      opacity: 0.38
    });
    const edges = new THREE.LineSegments(edgeGeo, edgeMat);
    mesh.add(edges);

    mesh.userData = {
      basePos: new THREE.Vector3(x, y, z),
      vel: new THREE.Vector3(),
      rotVel: new THREE.Vector3(),
      phase: Math.random() * Math.PI * 2,
      origOpacity: isClear ? 0.22 : 0.55
    };

    rootGroup.add(mesh);
  }

  function buildCube() {
    while (rootGroup.children.length > 0) {
      const child = rootGroup.children[0];
      child.material.dispose();
      rootGroup.remove(child);
    }
    exploded = false;
    explodeTimer = 0;
    subdivide(0, 0, 0, 3.0, 0, 3);
  }

  // パーン！と爆発させる関数
  function triggerExplosion(epicenter) {
    exploded = true;
    explodeTimer = 2.6; // 約2.6秒散らばったあと自動で戻り始める
    shakeIntensity = 0.28; // 画面がちょっと揺れる衝撃

    const origin = epicenter || new THREE.Vector3(0, 0, 0);

    for (const mesh of rootGroup.children) {
      const dir = mesh.position.clone().sub(origin);
      if (dir.lengthSq() < 0.001) {
        dir.set(Math.random() - 0.5, Math.random() - 0.5, Math.random() - 0.5);
      }
      dir.normalize();

      // 外側へ向かう強い初速＋ランダムな散らばり
      const power = 0.16 + Math.random() * 0.28;
      mesh.userData.vel.copy(dir).multiplyScalar(power);
      mesh.userData.vel.x += (Math.random() - 0.5) * 0.08;
      mesh.userData.vel.y += (Math.random() - 0.5) * 0.08;
      mesh.userData.vel.z += (Math.random() - 0.5) * 0.08;

      // 吹っ飛びながらクルクル回る速度
      mesh.userData.rotVel.set(
        (Math.random() - 0.5) * 0.22,
        (Math.random() - 0.5) * 0.22,
        (Math.random() - 0.5) * 0.22
      );
    }
  }

  buildCube();

  const raycaster = new THREE.Raycaster();
  const pointer = new THREE.Vector2(-999, -999);
  let hoveredMesh = null;
  let downPos = { x: 0, y: 0 };

  window.addEventListener('pointermove', (e) => {
    pointer.x = (e.clientX / window.innerWidth) * 2 - 1;
    pointer.y = -(e.clientY / window.innerHeight) * 2 + 1;
  });

  window.addEventListener('pointerdown', (e) => {
    downPos.x = e.clientX;
    downPos.y = e.clientY;
  });

  // ドラッグじゃなくクリックした時だけ爆発！
  window.addEventListener('pointerup', (e) => {
    if (e.target.tagName === 'BUTTON') return;
    const dist = Math.hypot(e.clientX - downPos.x, e.clientY - downPos.y);
    if (dist > 6) return;

    raycaster.setFromCamera(pointer, camera);
    const hits = raycaster.intersectObjects(rootGroup.children, false);
    if (hits.length > 0) {
      // クリックした場所の少し奥を爆心地にして手前にも派手に飛ばす
      const hitPoint = hits[0].point.clone().multiplyScalar(0.4);
      triggerExplosion(hitPoint);
    }
  });

  document.getElementById('boomBtn').addEventListener('click', () => {
    triggerExplosion(new THREE.Vector3(
      (Math.random() - 0.5) * 0.6,
      (Math.random() - 0.5) * 0.6,
      (Math.random() - 0.5) * 0.6
    ));
  });

  document.getElementById('regenBtn').addEventListener('click', () => {
    buildCube();
  });

  let darkBg = false;
  document.getElementById('bgBtn').addEventListener('click', () => {
    darkBg = !darkBg;
    scene.background = new THREE.Color(darkBg ? 0x141421 : 0xeef1f5);
  });

  window.addEventListener('resize', () => {
    camera.aspect = window.innerWidth / window.innerHeight;
    camera.updateProjectionMatrix();
    renderer.setSize(window.innerWidth, window.innerHeight);
  });

  const clock = new THREE.Clock();
  function animate() {
    const dt = Math.min(clock.getDelta(), 0.05);
    const t = clock.elapsedTime;

    // ホバーで光る
    raycaster.setFromCamera(pointer, camera);
    const hits = raycaster.intersectObjects(rootGroup.children, false);
    const currentHit = hits.length > 0 ? hits[0].object : null;

    if (hoveredMesh && hoveredMesh !== currentHit) {
      hoveredMesh.material.opacity = hoveredMesh.userData.origOpacity;
      hoveredMesh = null;
    }
    if (currentHit && currentHit !== hoveredMesh) {
      hoveredMesh = currentHit;
      hoveredMesh.material.opacity = 0.92;
    }

    // 爆発の衝撃シェイク
    if (shakeIntensity > 0.001) {
      controls.target.set(
        (Math.random() - 0.5) * shakeIntensity,
        (Math.random() - 0.5) * shakeIntensity,
        (Math.random() - 0.5) * shakeIntensity
      );
      shakeIntensity *= 0.86;
    } else {
      controls.target.lerp(baseCamTarget, 0.2);
    }

    if (exploded) {
      explodeTimer -= dt;
      if (explodeTimer <= 0) {
        exploded = false;
      }
    }

    for (const mesh of rootGroup.children) {
      const { basePos, vel, rotVel, phase } = mesh.userData;

      if (exploded) {
        // 吹っ飛んで空気抵抗でふわっと減速
        mesh.position.add(vel);
        vel.multiplyScalar(0.94);

        mesh.rotation.x += rotVel.x;
        mesh.rotation.y += rotVel.y;
        mesh.rotation.z += rotVel.z;
        rotVel.multiplyScalar(0.95);
      } else {
        // 元の位置と角度へ磁石みたいに吸い寄せられて戻る
        const swell = 1 + Math.sin(t * 1.4 + phase) * 0.025;
        const targetPos = basePos.clone().multiplyScalar(swell);
        mesh.position.lerp(targetPos, 0.08);

        mesh.rotation.x *= 0.88;
        mesh.rotation.y *= 0.88;
        mesh.rotation.z *= 0.88;
      }
    }

    controls.update();
    renderer.render(scene, camera);
    requestAnimationFrame(animate);
  }
  animate();
</script>
</body>
</html>
