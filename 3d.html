<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ふざけ（じみた）工房｜超ふざけたネタ＆謎サイト置き場</title>
<style>
  body {
    font-family: "Hiragino Kaku Gothic ProN", "Meiryo", sans-serif;
    background-color: #141421;
    color: #f0f0f5;
    margin: 0;
    padding: 32px 18px;
  }
  .wrap {
    max-width: 680px;
    margin: 0 auto;
  }
  header {
    text-align: center;
    margin-bottom: 32px;
  }
  
  h1 {
    font-size: 24px;
    margin: 0 0 8px 0;
  }
  .lead {
    font-size: 13px;
    color: #a8a8c0;
    line-height: 1.6;
    margin: 0;
  }
  .grid {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(260px, 1fr));
    gap: 16px;
  }
  .card {
    background-color: #1e1e30;
    border: 1px solid #32324d;
    border-radius: 14px;
    padding: 20px;
    display: flex;
    flex-direction: column;
    justify-content: space-between;
  }
  .card-title {
    font-size: 17px;
    font-weight: bold;
    margin: 0 0 8px 0;
    color: #fff;
  }
  .card-desc {
    font-size: 13px;
    color: #b8b8d0;
    line-height: 1.55;
    margin: 0 0 18px 0;
  }
  .btn {
    display: inline-block;
    text-align: center;
    text-decoration: none;
    background-color: #ff6b8b;
    color: #fff;
    font-weight: bold;
    font-size: 13px;
    padding: 10px 14px;
    border-radius: 10px;
  }
  .btn.sub {
    background-color: #363654;
    color: #d0d0e8;
  }
  footer {
    margin-top: 36px;
    text-align: center;
    font-size: 11px;
    color: #767690;
  }

#bg-particles {
    position: fixed;
    inset: 0;
    width: 100%;
    height: 100%;
    z-index: -1;
    pointer-events: none;
  }

  .wrap {
    position: relative;
    z-index: 1;
  }
</style>
</head>
<body>
  <div class="wrap">
    <header>
     
　　　　<h1>３Dアートの世界</h1>

       <p class="lead">
        
        だいたいノリと勢いで増えたり消えたりする。<br>～くるくる回して遊んでみてね～
      </p>
    </header>

  <div class="grid">
    <div class="card">
　　<img src="./img/block.png" alt="3dキューブ">
      <div>
        <div class="card-title">3dキューブアート(Gemini)</div>
        <p class="card-desc">
          カラフルなキューブの集い        </p>
      </div>
      <a class="btn" href="./glass.html">キューブを触る（Gemini枠）</a>
    </div>

 <div class="grid">
    <div class="card">
　　<img src="./img/lotus.png" alt="3d蓮">
      <div>
        <div class="card-title">3d黄金蓮の花(Grok)</div>
        <p class="card-desc">
          黄金の蓮        </p>
      </div>
      <a class="btn" href="./lotus3d.html">黄金蓮を触る（Grok枠）</a>
    </div>
    
  </div>


</body>
</html>
