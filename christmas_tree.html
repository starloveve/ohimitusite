<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<title>クリスマスツリー飾り付け</title>
<style>
body {
  background: linear-gradient(#0a0a2a, #1a1a4a);
  color: white;
  font-family: "Hiragino Sans", "Yu Gothic", "Noto Sans JP", sans-serif;
  text-align: center;
  margin: 0;
  padding: 20px;
  min-height: 100vh;
}
canvas {
  border: 2px solid #ffd700;
  border-radius: 10px;
  background: #0d1b2a;
  cursor: crosshair;
  box-shadow: 0 0 30px rgba(255, 215, 0, 0.3);
  max-width: 100%;
  height: auto;
  display: block;
  margin: 0 auto;
}
.controls {
  margin: 15px 0;
}
button, select {
  margin: 5px;
  padding: 8px 16px;
  font-size: 16px;
  background: #c41e3a;
  color: white;
  border: none;
  border-radius: 5px;
  cursor: pointer;
}
button:hover { background: #a01830; }
#status { margin-top: 10px; font-size: 14px; color: #ffd700; }
</style>
</head>
<body>
<h1>🎄 クリスマスツリー飾り付け 🎄</h1>
<div class="controls">
  <button id="clear">全部消す</button>
  <button id="random">ランダム飾り付け</button>
  <select id="ornament">
    <option value="ball">オーナメントボール</option>
    <option value="star">星</option>
    <option value="light">ライト</option>
    <option value="snow">雪の結晶</option>
    <option value="gift">プレゼント</option>
  </select>
  <select id="color">
    <option value="#ff0000">赤</option>
    <option value="#00ff00">緑</option>
    <option value="#ffff00">黄</option>
    <option value="#ff69b4">ピンク</option>
    <option value="#00bfff">青</option>
    <option value="#ffffff">白</option>
    <option value="#ffa500">オレンジ</option>
    <option value="#ffd700">金</option>
  </select>
</div>
<canvas id="tree" width="600" height="700"></canvas>
<div id="status">クリックで飾り付け！</div>

<script>
const canvas = document.getElementById('tree');
const ctx = canvas.getContext('2d');
const status = document.getElementById('status');

let ornaments = [];
let currentType = 'ball';
let currentColor = '#ff0000';

// ツリーの層データ（台形で自然に重なるように）
const layers = [
  { yTop: 440, yBottom: 580, widthTop: 140, widthBottom: 320, color: '#0a5c0a' },
  { yTop: 200, yBottom: 450, widthTop: 0,  widthBottom: 250, color: '#0d6b0d' },
  { yTop: 130, yBottom: 300, widthTop: 0,   widthBottom: 150,  color: '#128012' }
];

function drawLayer(yTop, yBottom, widthTop, widthBottom, color, centerX = 300) {
  ctx.fillStyle = color;
  ctx.beginPath();
  ctx.moveTo(centerX - widthTop / 2, yTop);
  ctx.lineTo(centerX - widthBottom / 2, yBottom);
  ctx.lineTo(centerX + widthBottom / 2, yBottom);
  ctx.lineTo(centerX + widthTop / 2, yTop);
  ctx.closePath();
  ctx.fill();
}

function drawTree() {
  ctx.clearRect(0, 0, canvas.width, canvas.height);

  // 幹
  ctx.fillStyle = '#8B4513';
  ctx.fillRect(270, 580, 60, 80);

  // 木（層を台形で描く）
  layers.forEach(L => drawLayer(L.yTop, L.yBottom, L.widthTop, L.widthBottom, L.color));

  // トップの星
  drawStar(300, 90, 25, '#ffd700');

  // 飾り付けを描画
  ornaments.forEach(o => drawOrnament(o));
}

function drawStar(x, y, size, color) {
  ctx.fillStyle = color;
  ctx.beginPath();
  for (let i = 0; i < 5; i++) {
    const outerAngle = (i * 4 * Math.PI / 5) - Math.PI / 2;
    const innerAngle = outerAngle + (2 * Math.PI / 5) / 2;
    const ox = x + Math.cos(outerAngle) * size;
    const oy = y + Math.sin(outerAngle) * size;
    const ix = x + Math.cos(innerAngle) * (size * 0.4);
    const iy = y + Math.sin(innerAngle) * (size * 0.4);
    if (i === 0) ctx.moveTo(ox, oy);
    else ctx.lineTo(ox, oy);
    ctx.lineTo(ix, iy);
  }
  ctx.closePath();
  ctx.fill();
}

function drawOrnament(o) {
  ctx.save();
  ctx.translate(o.x, o.y);
  ctx.fillStyle = o.color;
  ctx.strokeStyle = '#fff';
  ctx.lineWidth = 1;

  switch (o.type) {
    case 'ball':
      ctx.beginPath();
      ctx.arc(0, 0, 12, 0, Math.PI * 2);
      ctx.fill();
      ctx.stroke();
      ctx.fillStyle = 'rgba(255,255,255,0.4)';
      ctx.beginPath();
      ctx.arc(-4, -4, 4, 0, Math.PI * 2);
      ctx.fill();
      break;
    case 'star':
      drawStar(0, 0, 14, o.color);
      break;
    case 'light':
      ctx.shadowColor = o.color;
      ctx.shadowBlur = 15;
      ctx.beginPath();
      ctx.arc(0, 0, 6, 0, Math.PI * 2);
      ctx.fill();
      ctx.shadowBlur = 0;
      break;
    case 'snow':
      ctx.strokeStyle = o.color;
      ctx.lineWidth = 2;
      for (let i = 0; i < 6; i++) {
        ctx.beginPath();
        ctx.moveTo(0, 0);
        const angle = i * Math.PI / 3;
        ctx.lineTo(Math.cos(angle) * 12, Math.sin(angle) * 12);
        ctx.stroke();
      }
      break;
    case 'gift':
      ctx.fillRect(-10, -8, 20, 16);
      ctx.fillStyle = '#fff';
      ctx.fillRect(-2, -8, 4, 16);
      ctx.fillRect(-10, -2, 20, 4);
      break;
  }
  ctx.restore();
}

function isOnTree(x, y) {
  // 幹
  if (x >= 270 && x <= 330 && y >= 580 && y <= 660) return true;

  // 各層の台形内かどうか
  for (const L of layers) {
    if (y >= L.yTop && y <= L.yBottom) {
      const progress = (y - L.yTop) / (L.yBottom - L.yTop);
      const halfWidth = (L.widthTop + (L.widthBottom - L.widthTop) * progress) / 2;
      if (Math.abs(x - 300) <= halfWidth) return true;
    }
  }
  return false;
}

canvas.addEventListener('click', (e) => {
  const rect = canvas.getBoundingClientRect();
  const scaleX = canvas.width / rect.width;
  const scaleY = canvas.height / rect.height;

  const x = (e.clientX - rect.left) * scaleX;
  const y = (e.clientY - rect.top) * scaleY;

  if (isOnTree(x, y)) {
    ornaments.push({ x, y, type: currentType, color: currentColor });
    drawTree();
    status.textContent = `飾り付けたよ！ (${ornaments.length}個)`;
  } else {
    status.textContent = '木の上をクリックしてね';
  }
});

document.getElementById('ornament').addEventListener('change', (e) => {
  currentType = e.target.value;
});

document.getElementById('color').addEventListener('change', (e) => {
  currentColor = e.target.value;
});

document.getElementById('clear').addEventListener('click', () => {
  ornaments = [];
  drawTree();
  status.textContent = '全部消したよ';
});

document.getElementById('random').addEventListener('click', () => {
  ornaments = [];
  const types = ['ball', 'star', 'light', 'snow', 'gift'];
  const colors = ['#ff0000', '#00ff00', '#ffff00', '#ff69b4', '#00bfff', '#ffffff', '#ffa500', '#ffd700'];
  for (let i = 0; i < 30; i++) {
    let x, y;
    let attempts = 0;
    do {
      // 層をランダムに選んでその中に配置
      const L = layers[Math.floor(Math.random() * layers.length)];
      y = L.yTop + Math.random() * (L.yBottom - L.yTop);
      const progress = (y - L.yTop) / (L.yBottom - L.yTop);
      const halfWidth = (L.widthTop + (L.widthBottom - L.widthTop) * progress) / 2;
      x = 300 + (Math.random() - 0.5) * halfWidth * 1.8;
      attempts++;
    } while (!isOnTree(x, y) && attempts < 100);
    if (isOnTree(x, y)) {
      ornaments.push({
        x, y,
        type: types[Math.floor(Math.random() * types.length)],
        color: colors[Math.floor(Math.random() * colors.length)]
      });
    }
  }
  drawTree();
  status.textContent = 'ランダム飾り付けしたよ！';
});

// 初期描画
drawTree();
</script>
<footer>コード:Grok・SakanaAI生成（ナマズ君修正）<br><a href="index.html">じみた工房へ戻る</a></footer>
</body>
</html>
