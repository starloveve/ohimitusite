<!DOCTYPE html>
<html>
<body style="margin: 0; background: #050510; overflow: hidden; cursor: crosshair;">
<canvas id="canvas"></canvas>
<script>
const canvas = document.getElementById('canvas');
const ctx = canvas.getContext('2d');
canvas.width = window.innerWidth;
canvas.height = window.innerHeight;

let ripples = [];

function draw() {
    ctx.fillStyle = 'rgba(5, 5, 15, 0.2)';
    ctx.fillRect(0, 0, canvas.width, canvas.height);
    
    for (let i = ripples.length - 1; i >= 0; i--) {
        let r = ripples[i];
        r.size += 2;
        r.alpha -= 0.015;
        
        for(let j = 0; j < 3; j++) {
            let currentRadius = r.size - (j * 10);
            // 半径が0未満にならないようにするチェック
            if (currentRadius > 0) {
                ctx.beginPath();
                ctx.arc(r.x, r.y, currentRadius, 0, Math.PI * 2);
                ctx.strokeStyle = `rgba(200, 240, 255, ${Math.max(0, r.alpha * (1 - j * 0.3))})`;
                ctx.stroke();
            }
        }
        
        if (Math.random() > 0.8) {
            ctx.fillStyle = "white";
            ctx.fillRect(r.x + (Math.random()-0.5)*r.size, r.y + (Math.random()-0.5)*r.size, 1.5, 1.5);
        }
        
        if (r.alpha <= 0) ripples.splice(i, 1);
    }
    requestAnimationFrame(draw);
}

canvas.addEventListener('click', (e) => {
    ripples.push({x: e.clientX, y: e.clientY, size: 5, alpha: 1});
});

draw();
</script>
</body>
</html>
